# Uncrustify Configuration for Gkeyll
# -----------------------------------------------------------------------------
# This configuration file defines the coding style for the Gkeyll codebase.
# Based on K&R style with project-specific customizations.
#
# Usage:
#   uncrustify -c uncrustify.cfg --replace <file.c>
#   uncrustify -c uncrustify.cfg --check <file.c>
#
# To format all files:
#   find . -name "*.c" -o -name "*.h" | xargs uncrustify -c uncrustify.cfg --replace
# -----------------------------------------------------------------------------

# General options
newlines                        = lf        # Unix line endings
input_tab_size                  = 2         # Tab size for input
output_tab_size                 = 2         # Tab size for output
indent_columns                  = 2         # Number of columns for indentation
indent_with_tabs                = 0         # Use spaces, not tabs

# File filtering - exclude auto-generated kernel files
file_ext                        = c,h,cu    # Only process these extensions
exclude_paths                   = */ker/*   # Exclude all files in ker/ directories (auto-generated kernels)

# -----------------------------------------------------------------------------
# Brace style: K&R (opening brace on same line as control statement)
# -----------------------------------------------------------------------------
nl_if_brace                     = remove    # if () { on same line
nl_else_brace                   = remove    # else { on same line
nl_elseif_brace                 = remove    # else if () { on same line
nl_for_brace                    = remove    # for () { on same line
nl_while_brace                  = remove    # while () { on same line
nl_do_brace                     = remove    # do { on same line
nl_switch_brace                 = remove    # switch () { on same line
nl_brace_else                   = force     # } else on separate lines
nl_brace_while                  = remove    # } while on same line (for do-while)

# Function braces: opening brace on new line (K&R for C functions)
nl_fdef_brace                   = force     # Function definition: brace on new line
nl_fcall_brace                  = remove    # Function call: brace on same line

# Struct/enum/union braces
nl_struct_brace                 = remove    # struct { on same line
nl_union_brace                  = remove    # union { on same line
nl_enum_brace                   = remove    # enum { on same line

# -----------------------------------------------------------------------------
# Spacing around operators and keywords
# -----------------------------------------------------------------------------
sp_arith                        = force     # Space around arithmetic operators
sp_assign                       = force     # Space around assignment
sp_compare                      = force     # Space around comparison operators
sp_bool                         = force     # Space around boolean operators
sp_after_comma                  = force     # Space after comma
sp_before_comma                 = remove    # No space before comma

# Exception: allow no space around + in certain contexts (like poly_order+1)
sp_arith_additive               = ignore    # Allow no space around + and -

# Pointer and reference spacing:
# - Variable declarations: * attached to name (e.g., struct foo *bar)
# - Function return types: * attached to type (e.g., struct foo*)
# - Function parameters: * attached to name (e.g., struct foo *bar)
# Note: sp_before_ptr_star_func and sp_after_ptr_star_func control function return types
sp_before_ptr_star              = force     # Space before * in variable declarations
sp_after_ptr_star               = remove    # No space after * (attached to name)
sp_between_ptr_star             = remove    # No space between multiple *
sp_before_ptr_star_func         = remove    # No space before * in function return types (attached to type)
sp_after_ptr_star_func          = ignore    # Don't force space after * in return types (newline follows)
sp_ptr_star_paren               = remove    # No space between * and ( in casts
sp_after_ptr_star_qualifier     = force     # Space after * before qualifiers like GKYL_RESTRICT (produces: double* GKYL_RESTRICT)

# Function call/definition spacing
sp_func_call_paren              = remove    # No space between function name and (
sp_func_def_paren               = remove    # No space between function name and (
sp_func_proto_paren             = remove    # No space in prototypes
sp_func_class_paren             = remove    # No space for class methods
sp_inside_paren                 = remove    # No space inside parentheses
sp_inside_fparen                = remove    # No space inside function parentheses

# Control statement spacing
sp_before_sparen                = force     # Space before ( in if/for/while
sp_inside_sparen                = remove    # No space inside control statement parens
sp_after_sparen                 = force     # Space after ) in control statements
sp_sparen_brace                 = force     # Space between ) and { in control statements

# Brace spacing
sp_inside_braces                = force     # Space inside { } for arrays and initializers
sp_inside_braces_struct         = remove    # No space inside struct { } (keep struct fields tight)
sp_inside_braces_enum           = remove    # No space inside enum { }
sp_brace_else                   = force     # Space between } and else
sp_else_brace                   = force     # Space between else and {

# Struct initialization and compound literals
sp_brace_init_lst               = remove    # No extra space in initializer lists
nl_brace_struct_var             = remove    # Keep struct var = { on same line
pos_bool                        = trail     # Position of closing brace for compound literals

# Semicolon spacing
sp_before_semi                  = remove    # No space before semicolon
sp_after_semi                   = force     # Space after semicolon in for loops
sp_after_semi_for_empty         = remove    # No space in empty for clauses

# Cast spacing
sp_after_cast                   = remove    # No space after cast (void*)ptr
sp_inside_paren_cast            = remove    # No space inside cast parens

# Square bracket spacing
sp_before_square                = remove    # No space before [
sp_inside_square                = remove    # No space inside [ ]

# -----------------------------------------------------------------------------
# Newlines and blank lines
# -----------------------------------------------------------------------------
nl_after_brace_open             = false     # No newline after { in single-line
nl_before_brace_close           = false     # No newline before }
nl_after_func_body              = 2         # Blank line after function body
nl_after_func_proto             = 1         # Single newline after prototype
nl_max                          = 2         # Maximum consecutive blank lines
nl_before_block_comment         = 2         # Blank line before block comments
nl_after_struct                 = 1         # Newline after struct definition

# Collapse empty blocks
nl_collapse_empty_body          = true      # Collapse empty function bodies

# -----------------------------------------------------------------------------
# Alignment (minimal - Gkeyll uses simple alignment)
# -----------------------------------------------------------------------------
align_var_def_span              = 0         # Don't align variable definitions
align_var_def_star_style        = 1         # Align * with variable name
align_assign_span               = 0         # Don't align assignments
align_enum_equ_span             = 0         # Don't align enum assignments
align_struct_init_span          = 0         # Don't align struct initializers
align_right_cmt_span            = 0         # Don't align right-side comments
align_pp_define_span            = 0         # Don't align preprocessor defines

# Function call parentheses and struct literals
indent_paren_nl                 = true      # Indent when parentheses are split
indent_paren_close              = 0         # Don't add extra indent to closing paren
indent_paren_after_func_def     = false     # Don't extra-indent function def params
pos_arith                       = trail     # Position arithmetic operators at end of line
nl_func_call_paren              = remove    # Keep opening paren on same line
nl_func_call_paren_empty        = remove    # Keep empty parens together

# Compound literal / brace initializer indentation
indent_brace_parent             = false     # Don't indent braces relative to parent
indent_continue                 = 2         # Continue line indent
indent_shift                    = 0         # Additional shift for continuation
nl_ds_struct_enum_cmt           = false     # Don't add newline after struct/enum comment
eat_blanks_before_close_brace   = true      # Remove blank lines before }
nl_func_call_end                = remove    # Keep closing ) on same line when possible
nl_func_call_end_multi_line     = false     # Don't force newline before ) in multi-line calls

# -----------------------------------------------------------------------------
# Comments
# -----------------------------------------------------------------------------
cmt_indent_multi                = true      # Indent multi-line comments
cmt_star_cont                   = true      # Add * at start of continued comments
cmt_sp_before_star_cont         = 1         # Space before continued comment *
cmt_sp_after_star_cont          = 1         # Space after continued comment *
sp_cmt_cpp_start                = force     # Space after // in comments

# -----------------------------------------------------------------------------
# Preprocessor
# -----------------------------------------------------------------------------
pp_indent                       = remove    # Don't indent preprocessor directives
pp_space                        = remove    # No space after # in directives
pp_indent_if                    = 0         # Don't indent #if blocks
pp_if_indent_code               = false     # Don't indent code in #if blocks

# -----------------------------------------------------------------------------
# Line length and wrapping
# -----------------------------------------------------------------------------
code_width                      = 100       # Maximum line width. 100 is best for Vim
ls_for_split_full               = true      # Split for loops at semicolons
ls_func_split_full              = false     # Don't force split on long function calls

# Control where line breaks can occur
ls_code_width                   = false     # Disable automatic line splitting
pos_arith                       = trail     # Keep operators at end of line
pos_assign                      = trail     # Keep assignment operators at end of line
pos_bool                        = trail     # Keep boolean operators at end of line

# -----------------------------------------------------------------------------
# Single-line statements (require braces per coding guidelines)
# -----------------------------------------------------------------------------
mod_full_brace_if               = add       # Always add braces to if
mod_full_brace_else             = add       # Always add braces to else
mod_full_brace_for              = add       # Always add braces to for
mod_full_brace_while            = add       # Always add braces to while
mod_full_brace_do               = add       # Always add braces to do
mod_full_brace_if_chain         = true      # Add braces to entire if-else chain

# -----------------------------------------------------------------------------
# Parentheses
# -----------------------------------------------------------------------------
mod_paren_on_return             = remove    # No parens on return: return x; not return (x);

# -----------------------------------------------------------------------------
# Sorting (disabled - maintain original order)
# -----------------------------------------------------------------------------
mod_sort_include                = false     # Don't sort includes
mod_sort_using                  = false     # Don't sort using statements

# -----------------------------------------------------------------------------
# Type handling
# -----------------------------------------------------------------------------
indent_class                    = true      # Indent class bodies
indent_func_def_param           = true      # Indent continued function params
indent_func_call_param          = true      # Indent continued call params

# Long parameter lists: continuation indent
indent_param                    = 2         # Continuation indent for parameters
indent_func_def_param_paren_pos_threshold = 0

# Function parameter wrapping
ls_func_split_full              = false     # Don't force function parameter splitting
ls_code_width                   = false     # Disable automatic line splitting based on code_width

# -----------------------------------------------------------------------------
# Special Gkeyll patterns
# -----------------------------------------------------------------------------
# GKYL_RESTRICT handling - treat as keyword
set RESTRICT GKYL_RESTRICT

# Handle common macros
set MACRO GKYL_MAX2 GKYL_MIN2 NELM NCOM NSIZE
