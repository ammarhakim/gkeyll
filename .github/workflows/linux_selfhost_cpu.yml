name: Self-Hosted CPU Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, enqueued, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v2

      - name: Configure
        run: |
          ./machines/configure.linux.cpu.sh
          chmod +x .github/workflows/make-module.sh
          chmod +x .github/workflows/make-valcheck.sh

      # Core module
      - name: Build core-unit
        run: .github/workflows/make-module.sh core unit 8
      - name: Build core-regression
        run: .github/workflows/make-module.sh core regression 8
      - name: Test core-valcheck
        run: .github/workflows/make-valcheck.sh core 1

      # Moments module
      - name: Build moments-unit
        run: .github/workflows/make-module.sh moments unit 8
      - name: Build moments-regression
        run: .github/workflows/make-module.sh moments regression 8
      - name: Test moments-valcheck
        run: .github/workflows/make-valcheck.sh moments 1

      # Vlasov module
      - name: Build vlasov-unit
        run: .github/workflows/make-module.sh vlasov unit 8
      - name: Build vlasov-regression
        run: .github/workflows/make-module.sh vlasov regression 8
      - name: Test vlasov-valcheck
        run: .github/workflows/make-valcheck.sh vlasov 1

      # Gyrokinetic module
      - name: Build gyrokinetic-unit
        run: .github/workflows/make-module.sh gyrokinetic unit 8
      - name: Build gyrokinetic-regression
        run: .github/workflows/make-module.sh gyrokinetic regression 8
      - name: Test gyrokinetic-valcheck
        run: .github/workflows/make-valcheck.sh gyrokinetic 1

      # PKPM module
      - name: Build pkpm-regression
        run: .github/workflows/make-module.sh pkpm regression 8
