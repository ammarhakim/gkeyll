name: Self-Hosted Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v2
    
    - name: Configure
      run: |
        ./machines/configure.linux.cpu.sh
        chmod +x .github/scripts/make-module.sh
        chmod +x .github/workflows/make-check.sh
    
    # Core module
    - name: Build core-unit
      run: .github/scripts/make-module.sh core unit 8
    - name: Build core-regression
      run: .github/scripts/make-module.sh core regression 8
    - name: Test core-check
      run: .github/workflows/make-check.sh core 8
    
    # Moments module
    - name: Build moments-unit
      run: .github/scripts/make-module.sh moments unit 8
    - name: Build moments-regression
      run: .github/scripts/make-module.sh moments regression 8
    - name: Test moments-check
      run: .github/workflows/make-check.sh moments 8
      
    # Vlasov module
    - name: Build vlasov-unit
      run: .github/scripts/make-module.sh vlasov unit 8
    - name: Build vlasov-regression
      run: .github/scripts/make-module.sh vlasov regression 8
    - name: Test vlasov-check
      run: .github/workflows/make-check.sh vlasov 8
    
    # Gyrokinetic module
    - name: Build gyrokinetic-unit
      run: .github/scripts/make-module.sh gyrokinetic unit 8
    - name: Build gyrokinetic-regression
      run: .github/scripts/make-module.sh gyrokinetic regression 8
    - name: Test gyrokinetic-check
      run: .github/workflows/make-check.sh gyrokinetic 8
    
    # PKPM module
    - name: Build pkpm-regression
      run: .github/scripts/make-module.sh pkpm regression 8